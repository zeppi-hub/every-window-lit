<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <link rel="icon" href="data:," />
    <title>Every Window Lit</title>
    <style>
      body { margin: 0; background: #e9c9a6; font-family: Georgia, 'Times New Roman', serif; }
      #landing {
        position: fixed; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 18px; padding: 24px;
        background: rgba(43, 36, 30, 0.55); color: #f6ecd9; text-align: center;
      }
      #landing[hidden] { display: none; }
      #landing h1 { margin: 0; font-size: clamp(32px, 6vw, 56px); font-weight: normal; letter-spacing: 0.02em; }
      #landing p { margin: 0; max-width: 32em; line-height: 1.5; }
      #enter-vr {
        font: inherit; font-size: 20px; padding: 14px 34px; border: 0; border-radius: 999px;
        background: #f6ecd9; color: #3a2e24; cursor: pointer;
      }
      #enter-vr:disabled { opacity: 0.5; cursor: default; }
      #landing small { opacity: 0.8; }
    </style>
  </head>
  <body>
    <div id="scene-container"></div>
    <div id="landing">
      <h1>Every Window Lit</h1>
      <p>Sit down, open the shutters, and look after a small island town.</p>
      <button id="enter-vr" type="button" disabled>Loading…</button>
      <small id="landing-note">Seated, hands only. Made for ages 13 and up.</small>
    </div>
    <script type="module" src="/src/index.ts"></script>
  </body>
</html>
